version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: mira-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mira
      POSTGRES_PASSWORD: mira
      POSTGRES_DB: mira
    volumes:
      - mira_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mira -d mira"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mira_pg_data:
